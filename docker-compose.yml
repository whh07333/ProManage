services:
  mysql:
    image: mysql:8.0
    container_name: promanage-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zentao
      MYSQL_USER: zentao
      MYSQL_PASSWORD: zentao
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: always
    networks:
      - promanage-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  promanage-web:
    image: easysoft/zentao:latest
    container_name: promanage-web
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=zentao
      - MYSQL_PASSWORD=zentao
      - MYSQL_DATABASE=zentao
    volumes:
      - ./:/app
      - zentao-data:/data/zentao
      - session-data:/data/php/session
      - ./docker-sync.sh:/docker-sync.sh
    ports:
      - "8090:80"
    restart: always
    networks:
      - promanage-network
    entrypoint: ["/bin/bash", "-c", "/docker-sync.sh && /usr/bin/entrypoint.sh apache2-foreground"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  promanage-network:
    driver: bridge

volumes:
  mysql-data:
  zentao-data:
  session-data:
